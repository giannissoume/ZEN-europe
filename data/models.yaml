# Combinations of the three added CDR pathways. All retain pyrolysis and
# biochar-to-hard-coal fuel substitution. baseline disables their application
# routes; existing baseline technologies (including DAC and CCS) are retained.
# This control is not the original pre-BCR pyrolysis representation.
models:
  baseline:
    settings:
      structure:
        remove_technologies: [biochar_application]
        set_sectors:
          - electricity
          - biochar_cdr
          - carbon
          - gas
          - heat
          - district_heating
          - hydrogen
          - ammonia
          - cement
          - methanol
          - refining
          - aviation
          - shipping
          - steel
          - passenger_transport
          - truck_transport

  bcr:
    extends: baseline
    settings:
      structure:
        remove_technologies: []

  erw_only:
    extends: baseline
    settings:
      structure:
        set_sectors:
          - electricity
          - biochar_cdr
          - carbon
          - gas
          - heat
          - district_heating
          - hydrogen
          - ammonia
          - cement
          - methanol
          - refining
          - aviation
          - shipping
          - steel
          - passenger_transport
          - truck_transport
          - basalt_erw

  oae_only:
    extends: baseline
    settings:
      structure:
        set_sectors:
          - electricity
          - biochar_cdr
          - carbon
          - gas
          - heat
          - district_heating
          - hydrogen
          - ammonia
          - cement
          - methanol
          - refining
          - aviation
          - shipping
          - steel
          - passenger_transport
          - truck_transport
          - liming_oae

  bcr_erw:
    extends: erw_only
    settings:
      structure:
        remove_technologies: []

  bcr_oae:
    extends: oae_only
    settings:
      structure:
        remove_technologies: []

  erw_oae:
    extends: baseline
    settings:
      structure:
        set_sectors:
          - electricity
          - biochar_cdr
          - carbon
          - gas
          - heat
          - district_heating
          - hydrogen
          - ammonia
          - cement
          - methanol
          - refining
          - aviation
          - shipping
          - steel
          - passenger_transport
          - truck_transport
          - basalt_erw
          - liming_oae

  bcr_erw_oae:
    extends: erw_oae
    settings:
      structure:
